server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests (optional, but good for local routing if client origin matches, 
    # though baseURL in client.ts is hardcoded to http://localhost:4000)
    # We serve static files directly, and the browser hits localhost:4000 directly.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
